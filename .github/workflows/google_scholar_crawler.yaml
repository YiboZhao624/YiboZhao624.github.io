name: Get Citation Data

on:
  push:
    branches: [main]
    paths:
      - 'google_scholar_crawler/**'
      - '.github/workflows/google_scholar_crawler.yaml'
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install -r google_scholar_crawler/requirements.txt
        python -m pip check
    - name: Test crawler
      run: python -m unittest discover -s google_scholar_crawler -p 'test_*.py'
    - name: Fetch citation data
      id: fetch
      working-directory: google_scholar_crawler
      run: python main.py
      env:
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
    - name: Publish citation data
      if: steps.fetch.outputs.updated == 'true'
      working-directory: google_scholar_crawler/results
      run: |
        git init
        git config --local user.name "${GITHUB_ACTOR}"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
        git add *.json
        git commit -m "Updated Citation Data"
        git push "${remote_repo}" HEAD:google-scholar-stats --force
